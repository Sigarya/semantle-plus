[build]
  publish = "dist"  
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[prerender]]
  path = "/*"

# Also expose noindex before JavaScript or prerendering runs.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/profile"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/profile/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
